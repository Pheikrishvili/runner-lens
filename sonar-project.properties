# ─────────────────────────────────────────────────────────────
# SonarCloud / SonarQube analysis configuration
#
# Set SONAR_TOKEN in the repo secrets and run the scanner in CI
# (see .github/workflows/ci.yml → the `sonar` job).
# ─────────────────────────────────────────────────────────────

sonar.projectKey=runnerlens_runner-lens
sonar.organization=runnerlens
sonar.projectName=RunnerLens

# Analysed source. `dist/` is a checked-in build artifact and `coverage/` is a
# generated report — analysing either only produces noise on generated code.
sonar.sources=src,scripts
sonar.tests=__tests__
sonar.exclusions=dist/**,coverage/**,node_modules/**

# Coverage is produced by `npm test` (jest --coverage → lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
