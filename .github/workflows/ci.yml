name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # ── Dogfood: monitor this CI job (local checkout — this repo) ──
      - uses: ./

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # ── Integration: verify the action loads & produces output ──
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cpu-avg: ${{ steps.lens.outputs.cpu-avg }}
      samples: ${{ steps.lens.outputs.samples }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci && npm run build

      # Use the local action (this repo)
      - uses: ./
        id: lens
        with:
          sample-interval: '1'
          max-file-size: '50'

      - run: sleep 10

      # Outputs are only set by the action's post step, which runs after
      # every step in this job — so they can't be checked here. They're
      # promoted to job outputs above and checked in verify-outputs instead.

  verify-outputs:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify outputs exist
        run: |
          echo "CPU avg: ${{ needs.integration.outputs.cpu-avg }}"
          echo "Samples: ${{ needs.integration.outputs.samples }}"
          test -n "${{ needs.integration.outputs.cpu-avg }}" || exit 1
          test -n "${{ needs.integration.outputs.samples }}" || exit 1
