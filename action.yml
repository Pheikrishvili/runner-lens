name: 'RunnerLens'
description: >
  Zero-config observability for GitHub Actions runners.
  Monitor CPU and memory usage in your workflow.
author: 'RunnerLens'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  sample-interval:
    description: 'Metric sampling interval in seconds (1–60)'
    required: false
    default: '5'
  github-token:
    description: 'GitHub token for per-step metrics (defaults to the built-in token)'
    required: false
    default: ${{ github.token }}
  max-file-size:
    description: 'Maximum metrics file size in MB before rotation (0 = unlimited)'
    required: false
    default: '100'
  upload-artifact:
    description: 'Upload metrics report as a workflow artifact (true/false)'
    required: false
    default: 'true'
  chart-url:
    description: 'Base URL of the LeanCI chart rendering service'
    required: false
    default: 'https://chart.dev.leanci.dev'
  api-url:
    description: 'Base URL of the LeanCI ingest API'
    required: false
    default: 'https://api.dev.leanci.dev'
  leanci-api-key:
    description: >
      LeanCI API key (store as a repository secret). One key unlocks all
      LeanCI paid features: without it charts render on the free tier
      (14-day image retention); a valid key gives 90-day retention and
      ingests the report into the LeanCI dashboard.
    required: false
    default: ''

outputs:
  cpu-avg:
    description: 'Average CPU usage %'
  cpu-max:
    description: 'Peak CPU usage %'
  mem-avg-mb:
    description: 'Average memory usage (MB)'
  mem-max-mb:
    description: 'Peak memory usage (MB)'
  mem-avg-pct:
    description: 'Average memory usage %'
  samples:
    description: 'Number of samples collected'
  duration-seconds:
    description: 'Monitoring wall-clock duration'
  report-json:
    description: 'Full report as a JSON string'

runs:
  using: 'node24'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
  post-if: 'always()'
